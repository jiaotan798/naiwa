plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}
version = mod_version
group = 'com.naiwa'
base.archivesName = 'naiwa'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.252'
    runs {
        client { client() }
        acceptanceClient {
            client()
            gameDirectory = file('run-acceptance')
            systemProperty 'naiwa.acceptance', 'true'
            programArguments.addAll('--username', 'NaiwaCheck', '--width', '960', '--height', '720')
        }
        server { server(); programArgument '--nogui' }
        gameplayAcceptanceClient {
            client()
            gameDirectory = file('run-acceptance')
            systemProperty 'naiwa.acceptance', 'true'
            systemProperty 'naiwa.fullOnly', 'true'
            programArguments.addAll('--username', 'NaiwaCheck', '--width', '960', '--height', '720')
        }
        configAcceptanceClient {
            client()
            gameDirectory = file('run-config-acceptance')
            systemProperty 'naiwa.acceptance', 'true'
            systemProperty 'naiwa.configOnly', 'true'
            programArguments.addAll('--username', 'NaiwaConfigCheck', '--width', '1000', '--height', '760')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'naiwa'
        }
    }
    mods { naiwa { sourceSet(sourceSets.main) } }
}
// 模型采样产物由脚本生成；构建核对来源摘要，防止替换模型后误带旧资源。
sourceSets.main.resources.srcDir '../assets/runtime'
tasks.register('verifyModel', Exec) {
    commandLine 'node', file('../scripts/bake-model.mjs'), '--check'
}
def resourceVersion = project.version.toString()
tasks.named('processResources') {
    dependsOn verifyModel
    exclude 'model-manifest.json'
    exclude 'native-pose-checks.json'
    inputs.property('version', resourceVersion)
    filesMatching('META-INF/neoforge.mods.toml') { expand(version: resourceVersion) }
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.register('modelChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.naiwa.client.ModelChecks'
    enableAssertions = true
}
tasks.named('check') { dependsOn modelChecks }
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
tasks.named('jar', Jar) {
    exclude 'com/naiwa/NaiwaGameTests*.class'
    exclude 'com/naiwa/NaiwaShieldTests*.class'
    exclude 'com/naiwa/NaiwaGameplayTests*.class'
    exclude 'com/naiwa/client/AcceptanceProbe*.class'
    exclude 'com/naiwa/client/FullGameplayProbe*.class'
    exclude 'data/naiwa/structure/empty.nbt'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// 联机探针独立成包；正式安装始终加载 releases 中的成品，不把测试入口带给玩家。
sourceSets {
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('qaJar', Jar) {
    from sourceSets.qa.output
    archiveFileName = 'naiwa-qa.jar'
    destinationDirectory = layout.buildDirectory.dir('qa')
}
