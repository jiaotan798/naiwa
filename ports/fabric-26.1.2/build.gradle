plugins { id 'net.fabricmc.fabric-loom' version '1.15.5' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.4'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.149.0+26.1.2'
}
ext.portGameVersion = '26.1.2'
ext.portLoader = 'Fabric'
apply from: '../port.gradle'
loom { runs { server { programArgs '--nogui' } } }
if (providers.gradleProperty('clientSmoke').isPresent()) {
    loom.runs {
        clientSmoke { client(); runDir 'run-client-smoke'; programArgs '--username','NaiwaPortQA' }
    }
}
jar { archiveFileName = "naiwa-${project.version}-Fabric-26.1.2.jar" }
fabricApi { configureTests { createSourceSet = true; modId = 'naiwa-tests'; enableClientGameTests = false; eula = true } }
sourceSets.gametest.java.srcDir('../shared-26.1.2/src/gametest/java')
tasks.named('processGametestResources') {
    from('../../mod/src/main/resources') { include 'data/naiwa/structure/empty.nbt' }
}
tasks.named('check') { dependsOn 'runGameTest' }
